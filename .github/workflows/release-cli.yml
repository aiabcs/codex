#name: Publish Codex CLI Build and Release Artifact
# Release workflow for codex-rs.
# To release, follow a workflow like:
# ```
# git tag -a v0.0.9 -m "Release 0.0.9"
# git push origin v0.0.9
# ```

name: codex-release
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
#on:
#  workflow_dispatch:
#   push:
#     branches: [ main, develop ]
#   pull_request:
#     branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies and build
        run: |
          pnpm install
          pnpm build
        working-directory: codex-cli

      - name: Install native dependencies (Linux only)
        run: ./scripts/install_native_deps.sh
        working-directory: codex-cli
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Get usage and options
        run: node ./dist/cli.js --help
        working-directory: codex-cli

      - name: Test CLI execution
        run: node ./dist/cli.js
        working-directory: codex-cli
        continue-on-error: true

      - name: Package
        run: |
          #pnpm test
          pnpm install
          pnpm run build
          rm -rf ./dist/openai-codex-*.tgz
          pnpm pack --pack-destination ./dist
          mv ./dist/openai-codex-*.tgz ./dist/codex.tgz
        working-directory: codex-cli

      - name: List contents of dist directory
        run: ls -la ./dist
        working-directory: codex-cli
      # publish artifact
      # publish artifact  
      - name: Upload codex.tgz artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: codex.tgz  
          path: ./codex-cli/dist/codex.tgz
  release:
    needs: build
    name: release
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: codex-${{ github.sha }}-${{ github.run_attempt }}-${{ github.ref_name }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List
        run: ls -R dist/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/**
          # For now, tag releases as "prerelease" because we are not claiming
          # the Rust CLI is stable yet.
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      # - uses: facebook/dotslash-publish-release@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}  # Use the PAT here too
      #   with:
      #     tag: ${{ env.RELEASE_TAG }}
      #     config: .github/dotslash-config.json
      
